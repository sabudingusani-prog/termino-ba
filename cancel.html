<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TERMINO | Otkaži termin</title>

<style>
body{
margin:0;
background:#0b0b0b;
color:#fff;
font-family:Arial,sans-serif;
padding:20px;
}

.card{
max-width:560px;
margin:70px auto;
background:#151515;
border:1px solid #333;
border-radius:20px;
padding:24px;
}

.logo{
color:#d8ad55;
font-size:38px;
font-weight:900;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:12px;
background:#8b2929;
color:#fff;
font-weight:900;
font-size:17px;
margin-top:18px;
}

#msg{
margin-top:16px;
font-weight:800;
line-height:1.5;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">TERMINO</div>

<h1>Otkaži termin</h1>

<p>
Ako više ne možeš doći, ovdje možeš otkazati rezervaciju.
</p>

<button id="cancel">
OTKAŽI TERMIN
</button>

<div id="msg"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const db =
supabase.createClient(
"https://ykkopljgzdcnfbyutxzo.supabase.co",
"sb_publishable_g0DyVw3GMFgrjZHwSeuvkQ_6x54CKue"
);

const token =
new URLSearchParams(
location.search
).get("token");

const msg =
document.getElementById("msg");

document
.getElementById("cancel")
.onclick =
async () => {

if(!token){

msg.textContent =
"Nedostaje token za otkazivanje.";

return;

}

if(
!confirm(
"Da li sigurno želiš otkazati termin?"
)
)
return;

const {
data,
error
} =
await db.rpc(
"cancel_booking_by_token",
{
p_token:token
}
);

if(error){

msg.style.color =
"#ff7373";

msg.textContent =
"Greška: "
+
error.message;

return;

}

if(data === true){

msg.style.color =
"#7ee787";

msg.textContent =
"✅ Termin je otkazan i vrijeme je ponovo slobodno.";

}

else{

msg.style.color =
"#aaa";

msg.textContent =
"Termin je već otkazan ili link nije važeći.";

}

};

</script>

</body>
</html>
