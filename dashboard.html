<script>

const SUPABASE_URL =
"https://chpevcwwrxnsexfzovds.supabase.co";

const SUPABASE_KEY =
"sb_publishable_W_zut9V5NDTHcSIeuE4J8g_4Rq_cBoG";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentSalon = null;
let editingServiceId = null;
let currentServices = [];

let audioContext = null;
let soundEnabled = false;
let notificationsInitialized = false;
let lastUnreadCount = 0;

const $ =
id => document.getElementById(id);

function escapeHtml(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

/* =========================
   ZVUK
========================= */

async function enableSound(){

try{

if(!audioContext){

audioContext =
new (
window.AudioContext ||
window.webkitAudioContext
)();

}

if(audioContext.state === "suspended"){

await audioContext.resume();

}

soundEnabled = true;

$("soundBtn").textContent =
"🔊 ZVUK UKLJUČEN";

$("soundBtn").classList.add("on");

/* kratki test zvuka */
playTone(880,0,0.15,0.25);

setTimeout(()=>{
playTone(660,0,0.22,0.28);
},180);

}
catch(e){

alert(
"Telefon nije dozvolio zvuk. Provjeri da telefon nije utišan."
);

}

}

function playTone(
frequency,
delay=0,
duration=0.25,
volume=0.35
){

if(!soundEnabled || !audioContext)
return;

const oscillator =
audioContext.createOscillator();

const gain =
audioContext.createGain();

oscillator.type =
"sine";

oscillator.frequency.value =
frequency;

oscillator.connect(gain);
gain.connect(audioContext.destination);

const start =
audioContext.currentTime + delay;

gain.gain.setValueAtTime(
0.0001,
start
);

gain.gain.exponentialRampToValueAtTime(
volume,
start + 0.02
);

gain.gain.exponentialRampToValueAtTime(
0.0001,
start + duration
);

oscillator.start(start);
oscillator.stop(start + duration + 0.05);

}

function ringNewBooking(){

if(!soundEnabled)
return;

/* DING DONG */
playTone(1046,0,0.32,0.5);

setTimeout(()=>{
playTone(784,0,0.42,0.55);
},330);

/* ponovi još jednom */
setTimeout(()=>{

playTone(1046,0,0.32,0.5);

setTimeout(()=>{
playTone(784,0,0.42,0.55);
},330);

},900);

if(navigator.vibrate){

navigator.vibrate([
200,
100,
200
]);

}

}

/* =========================
   USER
========================= */

async function user(){

const {
data:{user}
} =
await db.auth.getUser();

if(!user){

location.href =
"login.html";

return null;

}

return user;

}

async function logout(){

await db.auth.signOut();

location.href =
"login.html";

}

/* =========================
   NOTIFIKACIJE
========================= */

async function loadNotifications(){

if(!currentSalon)
return;

const {
data,
error
} =
await db
.from("notifications")
.select(`
id,
is_read,
created_at,
booking_id,
bookings(
customer_name,
booking_date,
booking_time,
phone,
services(
name
)
)
`)
.eq("salon_id",currentSalon.id)
.order("created_at",{
ascending:false
});

if(error){

console.error(error);

$("notifications").innerHTML =
'<div class="muted">Ne mogu učitati obavijesti.</div>';

return;

}

const notifications =
data || [];

const unread =
notifications.filter(
n => n.is_read !== true
).length;

/* ZAZVONI AKO JE STIGLA NOVA */

if(
notificationsInitialized &&
unread > lastUnreadCount
){

ringNewBooking();

await loadBookings();

}

lastUnreadCount = unread;
notificationsInitialized = true;

const badge =
$("notificationBadge");

if(unread > 0){

badge.textContent =
unread > 99 ? "99+" : unread;

badge.style.display =
"flex";

}
else{

badge.style.display =
"none";

}

if(!notifications.length){

$("notifications").innerHTML =
'<div class="muted">Nema novih obavijesti.</div>';

return;

}

$("notifications").innerHTML =
notifications.map(n=>{

const b =
n.bookings || {};

const service =
b.services || {};

const time =
String(
b.booking_time || ""
).slice(0,5);

return `
<div class="notification ${n.is_read ? "" : "unread"}">

<div class="notificationText">

<strong>
${n.is_read ? "Rezervacija" : "🆕 Nova rezervacija"}
</strong>

<br><br>

👤 ${escapeHtml(b.customer_name || "Klijent")}

<br>

✂️ ${escapeHtml(service.name || "Usluga")}

<br>

📅 ${escapeHtml(b.booking_date || "")}
${time ? " u " + escapeHtml(time) : ""}

${b.phone
?
`<br>📞 ${escapeHtml(b.phone)}`
:
""
}

</div>

<div class="notificationDate">
Primljeno:
${formatNotificationDate(n.created_at)}
</div>

<div class="notificationActions">

${!n.is_read
?
`
<button
class="blue"
onclick="readNotification('${n.id}')">
PROČITANO
</button>
`
:
""
}

<button
class="red"
onclick="deleteNotification('${n.id}')">
OBRIŠI
</button>

</div>

</div>
`;

}).join("");

}

function formatNotificationDate(value){

if(!value)
return "";

const d =
new Date(value);

return d.toLocaleString(
"hr-HR",
{
day:"2-digit",
month:"2-digit",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
}
);

}

async function toggleNotifications(){

const panel =
$("notificationPanel");

const opening =
panel.style.display !== "block";

panel.style.display =
opening ? "block" : "none";

if(opening){

await loadNotifications();
await markAllNotificationsRead();

}

}

async function markAllNotificationsRead(){

if(!currentSalon)
return;

const {
error
} =
await db
.from("notifications")
.update({
is_read:true
})
.eq("salon_id",currentSalon.id)
.eq("is_read",false);

if(error){

console.error(error);
return;

}

lastUnreadCount = 0;

await loadNotifications();

}

async function readNotification(id){

const {
error
} =
await db
.from("notifications")
.update({
is_read:true
})
.eq("id",id);

if(error){

alert(
"Greška: " +
error.message
);

return;

}

await loadNotifications();

}

async function deleteNotification(id){

const yes =
confirm(
"Obrisati ovu obavijest?"
);

if(!yes)
return;

const {
error
} =
await db
.from("notifications")
.delete()
.eq("id",id);

if(error){

alert(
"Greška: " +
error.message
);

return;

}

await loadNotifications();

}

async function deleteAllNotifications(){

if(!currentSalon)
return;

const yes =
confirm(
"Obrisati sve obavijesti? Rezervacije neće biti obrisane."
);

if(!yes)
return;

const {
error
} =
await db
.from("notifications")
.delete()
.eq("salon_id",currentSalon.id);

if(error){

alert(
"Greška: " +
error.message
);

return;

}

lastUnreadCount = 0;

await loadNotifications();

}

/* =========================
   SALON
========================= */

async function loadSalon(){

const u =
await user();

if(!u) return null;

const {
data,
error
} =
await db
.from("salons")
.select("*")
.eq("owner_id",u.id)
.maybeSingle();

if(error){

console.error(error);
return null;

}

currentSalon = data;

if(data){

$("salonName").value =
data.name || "";

$("salonAddress").value =
data.address || "";

$("salonPhone").value =
data.phone || "";

}

return data;

}

async function saveSalon(){

const u =
await user();

if(!u) return;

const name =
$("salonName").value.trim();

const address =
$("salonAddress").value.trim();

const phone =
$("salonPhone").value.trim();

if(!name){

$("salonMsg").textContent =
"Upiši naziv salona.";

return;

}

let error;

if(currentSalon){

({
error
} =
await db
.from("salons")
.update({
name,
address,
phone
})
.eq("id",currentSalon.id));

}
else{

({
error
} =
await db
.from("salons")
.insert({
owner_id:u.id,
name,
address,
phone
}));

}

if(error){

$("salonMsg").textContent =
"Greška: " + error.message;

return;

}

$("salonMsg").textContent =
"✅ Spremljeno.";

await loadSalon();
await loadServices();
await loadBookings();
await loadSlots();
await loadNotifications();

}

/* =========================
   DOSTUPNOST
========================= */

const times = [];

for(let h = 8; h <= 20; h++){

for(let m of [0,15,30,45]){

if(h === 20 && m > 0)
continue;

times.push(
String(h).padStart(2,"0")
+
":"
+
String(m).padStart(2,"0")
);

}

}

async function loadSlots(){

if(!currentSalon)
return;

const date =
$("availabilityDate").value;

if(!date)
return;

const {
data,
error
} =
await db
.from("availability_slots")
.select("slot_time,is_available")
.eq("salon_id",currentSalon.id)
.eq("slot_date",date);

if(error){

$("availabilityMsg").textContent =
"Greška: " + error.message;

return;

}

const map = {};

(data || []).forEach(x => {

map[
String(x.slot_time).slice(0,5)
] =
x.is_available;

});

$("slots").innerHTML = "";

times.forEach(t => {

const b =
document.createElement("button");

const available =
map[t] === true;

b.className =
"slot "
+
(
available
?
"available"
:
"unavailable"
);

b.textContent = t;

b.onclick =
() =>
toggleSlot(
date,
t,
!available
);

$("slots").appendChild(b);

});

}

async function toggleSlot(
date,
time,
isAvailable
){

if(!currentSalon)
return;

const {
error
} =
await db
.from("availability_slots")
.upsert(
{
salon_id:currentSalon.id,
slot_date:date,
slot_time:time,
is_available:isAvailable
},
{
onConflict:
"salon_id,slot_date,slot_time"
}
);

if(error){

$("availabilityMsg").textContent =
"Greška: " + error.message;

return;

}

$("availabilityMsg").textContent =
isAvailable
?
"🟢 Označeno slobodno."
:
"🔴 Označeno nedostupno.";

await loadSlots();

}

$("availabilityDate")
.addEventListener(
"change",
loadSlots
);

/* =========================
   USLUGE
========================= */

function clearServiceForm(){

$("serviceCategory").value = "";
$("serviceName").value = "";
$("servicePrice").value = "";
$("serviceDuration").value = "";

}

function cancelServiceEdit(){

editingServiceId = null;

clearServiceForm();

$("serviceSaveBtn").textContent =
"DODAJ USLUGU";

$("cancelEdit").style.display =
"none";

$("serviceMsg").textContent =
"";

}

async function saveService(){

if(!currentSalon){

$("serviceMsg").textContent =
"Prvo spremi salon.";

return;

}

const category =
$("serviceCategory").value;

const name =
$("serviceName").value.trim();

const price =
Number(
$("servicePrice").value
);

const duration =
parseInt(
$("serviceDuration").value,
10
);

if(
!category ||
!name ||
!Number.isFinite(price) ||
!duration
){

$("serviceMsg").textContent =
"Popuni sva polja.";

return;

}

if(editingServiceId){

const {
error
} =
await db
.from("services")
.update({
category,
name,
price,
duration_minutes:duration
})
.eq("id",editingServiceId)
.eq("salon_id",currentSalon.id);

if(error){

$("serviceMsg").textContent =
"Greška: " + error.message;

return;

}

$("serviceMsg").textContent =
"✅ Usluga izmijenjena.";

editingServiceId = null;

clearServiceForm();

$("serviceSaveBtn").textContent =
"DODAJ USLUGU";

$("cancelEdit").style.display =
"none";

await loadServices();

return;

}

const {
error
} =
await db
.from("services")
.insert({
salon_id:currentSalon.id,
category,
name,
price,
duration_minutes:duration
});

if(error){

$("serviceMsg").textContent =
"Greška: " + error.message;

return;

}

$("serviceMsg").textContent =
"✅ Usluga dodana.";

clearServiceForm();

await loadServices();

}

function editService(id){

const service =
currentServices.find(
x => x.id === id
);

if(!service)
return;

editingServiceId =
service.id;

$("serviceCategory").value =
service.category || "";

$("serviceName").value =
service.name || "";

$("servicePrice").value =
service.price ?? "";

$("serviceDuration").value =
service.duration_minutes ?? "";

$("serviceSaveBtn").textContent =
"SPREMI IZMJENE";

$("cancelEdit").style.display =
"inline-block";

$("serviceMsg").textContent =
"✏️ Izmjenjuješ: " + service.name;

}

async function deleteService(id){

const service =
currentServices.find(
x => x.id === id
);

if(!service)
return;

const yes =
confirm(
'Izbrisati uslugu "' +
service.name +
'"?'
);

if(!yes)
return;

const {
error
} =
await db
.from("services")
.delete()
.eq("id",id)
.eq("salon_id",currentSalon.id);

if(error){

$("serviceMsg").textContent =
"Ne mogu izbrisati: "
+
error.message;

return;

}

if(editingServiceId === id){

cancelServiceEdit();

}

$("serviceMsg").textContent =
"🗑️ Usluga izbrisana.";

await loadServices();

}

async function loadServices(){

if(!currentSalon)
return;

const {
data,
error
} =
await db
.from("services")
.select("*")
.eq("salon_id",currentSalon.id)
.order("category")
.order("name");

if(error){

$("serviceMsg").textContent =
"Greška: " + error.message;

return;

}

currentServices =
data || [];

$("services").innerHTML = "";

if(!currentServices.length){

$("services").innerHTML =
'<div class="muted">Još nema usluga.</div>';

return;

}

currentServices.forEach(s => {

const d =
document.createElement("div");

d.className =
"service";

d.innerHTML =
`
<b>
${escapeHtml(s.category || "Ostalo")}
—
${escapeHtml(s.name)}
</b>

<br><br>

💰 ${escapeHtml(s.price)} KM
&nbsp; · &nbsp;
⏱️ ${escapeHtml(s.duration_minutes)} min

<div class="serviceButtons">

<button
class="blue"
onclick="editService('${s.id}')">
✏️ IZMIJENI
</button>

<button
class="red"
onclick="deleteService('${s.id}')">
🗑️ IZBRIŠI
</button>

</div>
`;

$("services").appendChild(d);

});

}

/* =========================
   REZERVACIJE
========================= */

function bookingDateTime(b){

const time =
String(
b.booking_time || "00:00"
).slice(0,8);

return new Date(
b.booking_date
+
"T"
+
time
);

}

function bookingHtml(
b,
old=false
){

const s =
b.services || {};

let status = "";

if(b.status){

status =
`
<br>
<span class="statusText">
Status:
${escapeHtml(b.status)}
</span>
`;

}

return `
<div class="booking ${old ? "old" : ""}">

<b>
${escapeHtml(b.booking_date)}
·
${escapeHtml(
String(b.booking_time).slice(0,5)
)}
</b>

<br><br>

✂️
${escapeHtml(s.category || "")}
${s.category && s.name ? " — " : ""}
${escapeHtml(s.name || "")}

<br>

👤 ${escapeHtml(
b.customer_name || ""
)}

<br>

📞 ${escapeHtml(
b.phone || ""
)}

${b.email
?
`<br>✉️ ${escapeHtml(b.email)}`
:
""
}

${b.note
?
`<br>📝 ${escapeHtml(b.note)}`
:
""
}

${status}

</div>
`;

}

async function loadBookings(){

if(!currentSalon)
return;

const {
data,
error
} =
await db
.from("bookings")
.select(`
customer_name,
phone,
email,
booking_date,
booking_time,
status,
note,
services(
name,
category,
price
)
`)
.eq(
"salon_id",
currentSalon.id
)
.order("booking_date")
.order("booking_time");

if(error){

$("upcomingBookings").innerHTML =
"Greška: " + error.message;

$("historyBookings").innerHTML =
"Greška: " + error.message;

return;

}

const now =
new Date();

const all =
data || [];

const upcoming =
all
.filter(
b =>
bookingDateTime(b) >= now
)
.sort(
(a,b) =>
bookingDateTime(a)
-
bookingDateTime(b)
);

const history =
all
.filter(
b =>
bookingDateTime(b) < now
)
.sort(
(a,b) =>
bookingDateTime(b)
-
bookingDateTime(a)
);

if(upcoming.length){

$("upcomingBookings").innerHTML =
upcoming
.map(
b => bookingHtml(b,false)
)
.join("");

}
else{

$("upcomingBookings").innerHTML =
`
<div class="muted">
Trenutno nema novih termina.
</div>
`;

}

if(history.length){

$("historyBookings").innerHTML =
history
.map(
b => bookingHtml(b,true)
)
.join("");

}
else{

$("historyBookings").innerHTML =
`
<div class="muted">
Još nema starih termina.
</div>
`;

}

}

function showUpcoming(){

$("upcomingBookings")
.classList.remove("hidden");

$("historyBookings")
.classList.add("hidden");

$("upcomingBtn")
.classList.add("active");

$("historyBtn")
.classList.remove("active");

}

function showHistory(){

$("upcomingBookings")
.classList.add("hidden");

$("historyBookings")
.classList.remove("hidden");

$("historyBtn")
.classList.add("active");

$("upcomingBtn")
.classList.remove("active");

}

async function init(){

const d =
new Date();

const year =
d.getFullYear();

const month =
String(
d.getMonth()+1
).padStart(2,"0");

const day =
String(
d.getDate()
).padStart(2,"0");

$("availabilityDate").value =
`${year}-${month}-${day}`;

await loadSalon();
await loadSlots();
await loadServices();
await loadBookings();
await loadNotifications();

/* svakih 10 sekundi provjeri novu rezervaciju */

setInterval(
async ()=>{
await loadNotifications();
},
10000
);

/* kad se vratiš u TERMINO odmah provjeri */

document.addEventListener(
"visibilitychange",
async ()=>{

if(
document.visibilityState === "visible"
){

await loadNotifications();
await loadBookings();

}

}
);

}

init();

</script>
