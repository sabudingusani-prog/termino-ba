<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>TERMINO BA — Dashboard</title>

  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TERMINO">

  <link rel="manifest" href="/termino-ba/manifest.json">
  <link rel="apple-touch-icon" href="/termino-ba/icon-192.png">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b0b0b;
      color: #fff;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: #0b0b0b;
      border-bottom: 1px solid #292929;
      padding: 18px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #d4af37;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .bell {
      position: relative;
      background: #191919;
      color: #fff;
      border: 1px solid #333;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 21px;
    }

    .badge {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 21px;
      height: 21px;
      padding: 0 5px;
      border-radius: 20px;
      background: #e53935;
      color: white;
      font-size: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .logout {
      background: transparent;
      color: #aaa;
      padding: 8px;
    }

    main {
      width: min(950px, 100%);
      margin: auto;
      padding: 18px 14px 80px;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 16px;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    h2 {
      color: #d4af37;
      font-size: 20px;
    }

    .muted {
      color: #999;
      font-size: 14px;
    }

    input, select, textarea {
      width: 100%;
      padding: 13px;
      margin: 6px 0 12px;
      border: 1px solid #353535;
      border-radius: 11px;
      background: #0e0e0e;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 80px;
    }

    label {
      font-size: 14px;
      color: #bbb;
    }

    .gold-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: #d4af37;
      color: #080808;
      font-weight: 800;
      margin-top: 5px;
    }

    .outline-btn {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      background: transparent;
      color: #d4af37;
      border: 1px solid #d4af37;
      font-weight: bold;
      margin-top: 7px;
    }

    .danger-btn {
      padding: 9px 12px;
      border-radius: 9px;
      background: #351414;
      color: #ff7777;
    }

    .small-btn {
      padding: 9px 12px;
      border-radius: 9px;
      background: #292929;
      color: white;
    }

    .push-btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      background: #d4af37;
      color: #080808;
      font-weight: 900;
      font-size: 16px;
    }

    .push-on {
      background: #17351d;
      color: #7ee28c;
      border: 1px solid #397c43;
    }

    .item {
      border-top: 1px solid #2b2b2b;
      padding: 14px 0;
    }

    .item:first-of-type {
      border-top: none;
    }

    .row {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .row > * {
      flex: 1;
      min-width: 130px;
    }

    .price {
      color: #d4af37;
      font-weight: bold;
    }

    .status {
      display: inline-block;
      border-radius: 20px;
      padding: 5px 9px;
      font-size: 12px;
      background: #292929;
    }

    .notification-panel {
      display: none;
      position: fixed;
      z-index: 50;
      top: 76px;
      right: 12px;
      left: 12px;
      max-width: 520px;
      margin-left: auto;
      max-height: 70vh;
      overflow-y: auto;
      background: #151515;
      border: 1px solid #444;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 15px 50px #000;
    }

    .notification-panel.open {
      display: block;
    }

    .notice {
      padding: 12px 5px;
      border-bottom: 1px solid #292929;
    }

    .notice.unread {
      color: #fff;
      font-weight: bold;
    }

    .notice.read {
      color: #888;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
      gap: 7px;
      margin-top: 12px;
    }

    .slot {
      padding: 10px 5px;
      border-radius: 9px;
      text-align: center;
      border: 1px solid #333;
      background: #111;
      color: #888;
    }

    .slot.active {
      background: #18341d;
      color: #7ee28c;
      border-color: #397c43;
    }

    .hidden {
      display: none !important;
    }

    .message {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: #202020;
      display: none;
    }

    @media (min-width: 700px) {
      .notification-panel {
        left: auto;
        width: 480px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">TERMINO BA</div>

  <div class="top-actions">
    <button class="bell" id="bellBtn">
      🔔
      <span class="badge" id="badge">0</span>
    </button>

    <button class="logout" id="logoutBtn">Odjava</button>
  </div>
</header>

<div class="notification-panel" id="notificationPanel">
  <div class="row">
    <h3 style="margin:5px 0;flex:3;">Obavijesti</h3>
    <button class="small-btn" id="deleteNotifications">Obriši sve</button>
  </div>

  <div id="notificationList"></div>
</div>

<main>

  <div class="card">
    <h2>🔔 Push obavijesti</h2>

    <p class="muted">
      Uključi obavijesti da dobiješ upozorenje kada stigne nova rezervacija.
    </p>

    <button class="push-btn" id="pushBtn">
      🔔 UKLJUČI OBAVIJESTI
    </button>

    <div class="message" id="pushMessage"></div>
  </div>

  <div class="card">
    <h2>Moj salon</h2>

    <label>Naziv salona</label>
    <input id="salonName">

    <label>Adresa</label>
    <input id="salonAddress">

    <label>Telefon</label>
    <input id="salonPhone">

    <button class="gold-btn" id="saveSalon">
      SAČUVAJ PODATKE
    </button>

    <p class="muted" id="salonMessage"></p>
  </div>

  <div class="card">
    <h2>Usluge</h2>

    <label>Kategorija</label>
    <input id="serviceCategory" placeholder="npr. Šišanje">

    <label>Naziv usluge</label>
    <input id="serviceName" placeholder="npr. Žensko šišanje">

    <div class="row">
      <div>
        <label>Cijena (KM)</label>
        <input id="servicePrice" type="number" step="0.01">
      </div>

      <div>
        <label>Trajanje (min)</label>
        <input id="serviceDuration" type="number" value="30">
      </div>
    </div>

    <button class="gold-btn" id="addService">
      + DODAJ USLUGU
    </button>

    <div id="servicesList"></div>
  </div>

  <div class="card">
    <h2>Slobodni termini</h2>

    <label>Datum</label>
    <input id="availabilityDate" type="date">

    <p class="muted">
      Dodirni vrijeme da ga uključiš ili isključiš.
    </p>

    <div class="slots" id="slots"></div>
  </div>

  <div class="card">
    <h2>Nadolazeće rezervacije</h2>
    <div id="upcomingBookings"></div>
  </div>

  <div class="card">
    <h2>Historija rezervacija</h2>
    <div id="bookingHistory"></div>
  </div>

</main>

<script>
const SUPABASE_URL =
  "https://chpevcwwrxnsexfzovds.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_W_zut9V5NDTHcSIeuE4J8g_4Rq_cBoG";

const VAPID_PUBLIC_KEY =
  "BAjhITPmMK6bXQ2IqqZssmW2ylsEEmPhYQUOnE6hUyNz4yUyo3TILkGdW4jtWTl81Y6TQksL7_wD_F3pQL6tWWs";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;
let currentSalon = null;
let notificationIds = new Set();

const $ = id => document.getElementById(id);

function todayString() {
  const d = new Date();
  const offset = d.getTimezoneOffset();
  return new Date(d.getTime() - offset * 60000)
    .toISOString()
    .split("T")[0];
}

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

async function registerServiceWorker() {
  if (!("serviceWorker" in navigator)) return null;

  try {
    return await navigator.serviceWorker.register(
      "/termino-ba/service-worker.js",
      { scope: "/termino-ba/" }
    );
  } catch (error) {
    console.error("Service worker:", error);
    return null;
  }
}

function urlBase64ToUint8Array(base64String) {
  const padding =
    "=".repeat((4 - base64String.length % 4) % 4);

  const base64 =
    (base64String + padding)
      .replace(/-/g, "+")
      .replace(/_/g, "/");

  const rawData = atob(base64);

  return Uint8Array.from(
    [...rawData].map(char => char.charCodeAt(0))
  );
}

async function updatePushButton() {
  const btn = $("pushBtn");

  if (
    !("serviceWorker" in navigator) ||
    !("PushManager" in window) ||
    !("Notification" in window)
  ) {
    btn.textContent = "Push nije podržan na ovom uređaju";
    btn.disabled = true;
    return;
  }

  try {
    const registration =
      await navigator.serviceWorker.ready;

    const subscription =
      await registration.pushManager.getSubscription();

    if (
      subscription &&
      Notification.permission === "granted"
    ) {
      btn.textContent = "✅ OBAVIJESTI UKLJUČENE";
      btn.classList.add("push-on");
    } else {
      btn.textContent = "🔔 UKLJUČI OBAVIJESTI";
      btn.classList.remove("push-on");
    }
  } catch (error) {
    console.error(error);
  }
}

async function enablePushNotifications() {
  const message = $("pushMessage");
  message.style.display = "block";

  try {
    if (!currentSalon) {
      throw new Error("Salon nije učitan.");
    }

    if (
      !("serviceWorker" in navigator) ||
      !("PushManager" in window) ||
      !("Notification" in window)
    ) {
      throw new Error(
        "Ovaj uređaj ne podržava push obavijesti."
      );
    }

    const standalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;

    if (
      /iPhone|iPad|iPod/i.test(navigator.userAgent) &&
      !standalone
    ) {
      throw new Error(
        "Na iPhoneu prvo dodaj TERMINO na Home Screen i otvori ga preko TERMINO ikone."
      );
    }

    const permission =
      await Notification.requestPermission();

    if (permission !== "granted") {
      throw new Error(
        "Obavijesti nisu dozvoljene. Dozvoli ih u postavkama telefona."
      );
    }

    const registration =
      await navigator.serviceWorker.ready;

    let subscription =
      await registration.pushManager.getSubscription();

    if (!subscription) {
      subscription =
        await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey:
            urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
    }

    const data = subscription.toJSON();

    if (
      !data.endpoint ||
      !data.keys?.p256dh ||
      !data.keys?.auth
    ) {
      throw new Error(
        "Telefon nije napravio push pretplatu."
      );
    }

    const { error } = await db
      .from("push_subscriptions")
      .upsert(
        {
          salon_id: currentSalon.id,
          endpoint: data.endpoint,
          p256dh: data.keys.p256dh,
          auth: data.keys.auth
        },
        {
          onConflict: "endpoint"
        }
      );

    if (error) throw error;

    message.textContent =
      "✅ Push obavijesti su uključene.";

    await updatePushButton();

  } catch (error) {
    console.error(error);

    message.textContent =
      "⚠️ " + (error.message || "Greška pri uključivanju.");
  }
}

async function loadSalon() {
  const { data, error } = await db
    .from("salons")
    .select("*")
    .eq("owner_id", currentUser.id)
    .limit(1)
    .maybeSingle();

  if (error) throw error;

  if (!data) {
    alert("Salon nije pronađen.");
    return;
  }

  currentSalon = data;

  $("salonName").value = data.name || "";
  $("salonAddress").value = data.address || "";
  $("salonPhone").value = data.phone || "";
}

async function saveSalon() {
  if (!currentSalon) return;

  const { error } = await db
    .from("salons")
    .update({
      name: $("salonName").value.trim(),
      address: $("salonAddress").value.trim(),
      phone: $("salonPhone").value.trim()
    })
    .eq("id", currentSalon.id);

  $("salonMessage").textContent =
    error ? "Greška: " + error.message : "✅ Sačuvano.";

  if (!error) await loadSalon();
}

async function loadServices() {
  if (!currentSalon) return;

  const { data, error } = await db
    .from("services")
    .select("*")
    .eq("salon_id", currentSalon.id)
    .order("created_at");

  if (error) {
    console.error(error);
    return;
  }

  if (!data.length) {
    $("servicesList").innerHTML =
      '<p class="muted">Još nema dodanih usluga.</p>';
    return;
  }

  $("servicesList").innerHTML =
    data.map(service => `
      <div class="item">
        <strong>${escapeHtml(service.name)}</strong>
        <div class="muted">
          ${escapeHtml(service.category || "")}
        </div>
        <div>
          <span class="price">
            💰 ${escapeHtml(service.price)} KM
          </span>
          · ${escapeHtml(service.duration_minutes)} min
        </div>
        <br>
        <button
          class="danger-btn"
          onclick="deleteService('${service.id}')">
          Obriši
        </button>
      </div>
    `).join("");
}

async function addService() {
  if (!currentSalon) return;

  const name = $("serviceName").value.trim();
  const category = $("serviceCategory").value.trim();
  const price = Number($("servicePrice").value || 0);
  const duration =
    Number($("serviceDuration").value || 30);

  if (!name) {
    alert("Upiši naziv usluge.");
    return;
  }

  const { error } = await db
    .from("services")
    .insert({
      salon_id: currentSalon.id,
      category,
      name,
      price,
      duration_minutes: duration
    });

  if (error) {
    alert(error.message);
    return;
  }

  $("serviceName").value = "";
  $("serviceCategory").value = "";
  $("servicePrice").value = "";
  $("serviceDuration").value = "30";

  await loadServices();
}

async function deleteService(id) {
  if (!confirm("Obrisati ovu uslugu?")) return;

  const { error } = await db
    .from("services")
    .delete()
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  await loadServices();
}

function generateTimes() {
  const times = [];

  for (let hour = 8; hour <= 20; hour++) {
    for (let minute = 0; minute < 60; minute += 15) {
      if (hour === 20 && minute > 0) break;

      times.push(
        String(hour).padStart(2, "0") +
        ":" +
        String(minute).padStart(2, "0")
      );
    }
  }

  return times;
}

async function loadAvailability() {
  if (!currentSalon) return;

  const date = $("availabilityDate").value;
  if (!date) return;

  const { data, error } = await db
    .from("availability_slots")
    .select("*")
    .eq("salon_id", currentSalon.id)
    .eq("slot_date", date);

  if (error) {
    console.error(error);
    return;
  }

  const active = new Set(
    data
      .filter(x => x.is_available)
      .map(x => String(x.slot_time).slice(0, 5))
  );

  $("slots").innerHTML =
    generateTimes().map(time => `
      <button
        class="slot ${active.has(time) ? "active" : ""}"
        onclick="toggleSlot('${time}')">
        ${time}
      </button>
    `).join("");
}

async function toggleSlot(time) {
  if (!currentSalon) return;

  const date = $("availabilityDate").value;

  const { data } = await db
    .from("availability_slots")
    .select("*")
    .eq("salon_id", currentSalon.id)
    .eq("slot_date", date)
    .eq("slot_time", time)
    .maybeSingle();

  if (data) {
    const { error } = await db
      .from("availability_slots")
      .update({
        is_available: !data.is_available
      })
      .eq("id", data.id);

    if (error) {
      alert(error.message);
      return;
    }
  } else {
    const { error } = await db
      .from("availability_slots")
      .insert({
        salon_id: currentSalon.id,
        slot_date: date,
        slot_time: time,
        is_available: true
      });

    if (error) {
      alert(error.message);
      return;
    }
  }

  await loadAvailability();
}

async function loadBookings() {
  if (!currentSalon) return;

  const { data, error } = await db
    .from("bookings")
    .select(`
      *,
      services (
        name,
        price,
        duration_minutes
      )
    `)
    .eq("salon_id", currentSalon.id)
    .order("booking_date", { ascending: true })
    .order("booking_time", { ascending: true });

  if (error) {
    console.error(error);
    return;
  }

  const today = todayString();

  const upcoming = data.filter(
    b =>
      b.booking_date >= today &&
      b.status !== "cancelled"
  );

  const history = data.filter(
    b =>
      b.booking_date < today ||
      b.status === "cancelled"
  );

  renderBookings(
    upcoming,
    $("upcomingBookings"),
    "Nema nadolazećih rezervacija."
  );

  renderBookings(
    history.reverse(),
    $("bookingHistory"),
    "Historija je prazna."
  );
}

function renderBookings(bookings, container, emptyText) {
  if (!bookings.length) {
    container.innerHTML =
      `<p class="muted">${emptyText}</p>`;
    return;
  }

  container.innerHTML =
    bookings.map(b => {
      const service =
        Array.isArray(b.services)
          ? b.services[0]
          : b.services;

      return `
        <div class="item">
          <strong>
            ${escapeHtml(b.customer_name)}
          </strong>

          <div>
            📅 ${escapeHtml(b.booking_date)}
            &nbsp; 🕐
            ${escapeHtml(String(b.booking_time).slice(0,5))}
          </div>

          <div>
            ✂️ ${escapeHtml(service?.name || "Usluga")}
          </div>

          <div>
            📞 ${escapeHtml(b.phone || "")}
          </div>

          ${
            b.email
              ? `<div>✉️ ${escapeHtml(b.email)}</div>`
              : ""
          }

          ${
            b.note
              ? `<div>📝 ${escapeHtml(b.note)}</div>`
              : ""
          }

          <div style="margin-top:7px;">
            <span class="status">
              ${escapeHtml(b.status)}
            </span>
          </div>
        </div>
      `;
    }).join("");
}

async function loadNotifications(playSound = false) {
  if (!currentSalon) return;

  const { data, error } = await db
    .from("notifications")
    .select(`
      id,
      is_read,
      created_at,
      booking_id,
      bookings (
        customer_name,
        booking_date,
        booking_time
      )
    `)
    .eq("salon_id", currentSalon.id)
    .order("created_at", { ascending: false })
    .limit(50);

  if (error) {
    console.error(error);
    return;
  }

  const unread = data.filter(n => !n.is_read).length;

  if (unread > 0) {
    $("badge").style.display = "flex";
    $("badge").textContent =
      unread > 99 ? "99+" : unread;
  } else {
    $("badge").style.display = "none";
  }

  $("notificationList").innerHTML =
    data.length
      ? data.map(n => {
          const booking =
            Array.isArray(n.bookings)
              ? n.bookings[0]
              : n.bookings;

          return `
            <div class="notice ${n.is_read ? "read" : "unread"}">
              🔔 Nova rezervacija
              <br>
              <span class="muted">
                ${escapeHtml(booking?.customer_name || "")}
                · ${escapeHtml(booking?.booking_date || "")}
                ${escapeHtml(
                  String(booking?.booking_time || "").slice(0,5)
                )}
              </span>
              <br><br>
              <button
                class="danger-btn"
                onclick="deleteNotification('${n.id}')">
                Obriši
              </button>
            </div>
          `;
        }).join("")
      : '<p class="muted">Nema obavijesti.</p>';

  const currentIds = new Set(data.map(n => n.id));

  if (playSound && notificationIds.size > 0) {
    const hasNew =
      data.some(n => !notificationIds.has(n.id));

    if (hasNew) {
      playDing();
      if ("vibrate" in navigator) {
        navigator.vibrate([200,100,200]);
      }
    }
  }

  notificationIds = currentIds;
}

function playDing() {
  try {
    const AudioContext =
      window.AudioContext || window.webkitAudioContext;

    const ctx = new AudioContext();

    function tone(freq, start) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.18, ctx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(
        0.001,
        ctx.currentTime + start + 0.35
      );

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + 0.36);
    }

    tone(880, 0);
    tone(1175, 0.25);
  } catch (error) {
    console.log(error);
  }
}

async function markNotificationsRead() {
  if (!currentSalon) return;

  await db
    .from("notifications")
    .update({ is_read: true })
    .eq("salon_id", currentSalon.id)
    .eq("is_read", false);

  await loadNotifications(false);
}

async function deleteNotification(id) {
  await db
    .from("notifications")
    .delete()
    .eq("id", id);

  await loadNotifications(false);
}

async function deleteAllNotifications() {
  if (!currentSalon) return;

  if (!confirm("Obrisati sve obavijesti?")) return;

  await db
    .from("notifications")
    .delete()
    .eq("salon_id", currentSalon.id);

  await loadNotifications(false);
}

async function logout() {
  await db.auth.signOut();

  localStorage.removeItem("termino_access_token");
  localStorage.removeItem("termino_refresh_token");

  location.href = "login.html";
}

async function restoreCustomSession() {
  const access =
    localStorage.getItem("termino_access_token");

  const refresh =
    localStorage.getItem("termino_refresh_token");

  if (!access || !refresh) return;

  try {
    await db.auth.setSession({
      access_token: access,
      refresh_token: refresh
    });
  } catch (error) {
    console.error(error);
  }
}

async function init() {
  await registerServiceWorker();
  await restoreCustomSession();

  const {
    data: { session }
  } = await db.auth.getSession();

  if (!session?.user) {
    location.href = "login.html";
    return;
  }

  currentUser = session.user;

  try {
    await loadSalon();

    if (!currentSalon) return;

    $("availabilityDate").min = todayString();
    $("availabilityDate").value = todayString();

    await Promise.all([
      loadServices(),
      loadAvailability(),
      loadBookings(),
      loadNotifications(false)
    ]);

    await updatePushButton();

    setInterval(async () => {
      await loadNotifications(true);
      await loadBookings();
    }, 5000);

  } catch (error) {
    console.error(error);
    alert("Greška: " + error.message);
  }
}

$("saveSalon").addEventListener("click", saveSalon);
$("addService").addEventListener("click", addService);
$("availabilityDate").addEventListener(
  "change",
  loadAvailability
);

$("pushBtn").addEventListener(
  "click",
  enablePushNotifications
);

$("logoutBtn").addEventListener("click", logout);

$("deleteNotifications").addEventListener(
  "click",
  deleteAllNotifications
);

$("bellBtn").addEventListener("click", async () => {
  $("notificationPanel").classList.toggle("open");

  if (
    $("notificationPanel").classList.contains("open")
  ) {
    await markNotificationsRead();
  }
});

document.addEventListener("click", event => {
  const panel = $("notificationPanel");
  const bell = $("bellBtn");

  if (
    panel.classList.contains("open") &&
    !panel.contains(event.target) &&
    !bell.contains(event.target)
  ) {
    panel.classList.remove("open");
  }
});

window.deleteService = deleteService;
window.toggleSlot = toggleSlot;
window.deleteNotification = deleteNotification;

init();
</script>
