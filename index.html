<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salon Booking</title>
</head>

<body>
  <h1>Salon Booking</h1>
  <p>Rezerviraj svoj termin brzo i jednostavno.</p>

  <h2>Pronađi salon</h2>

  <input
    type="text"
    id="search"
    placeholder="Upiši naziv salona..."
  >

  <div id="salons">
    <p>Učitavanje salona...</p>
  </div>

  <script>
const SUPABASE_URL = "https://ykkopljgzdcnfbyutxzo.supabase.co";
    const SUPABASE_KEY = "sb_publishable_g0DyVw3GMFgrjZHwSeuvkQ_6x54CKue";

    async function loadSalons() {
      const response = await fetch(
        SUPABASE_URL + "/rest/v1/salons?select=*",
        {
          headers: {
            apikey: SUPABASE_KEY,
            Authorization: "Bearer " + SUPABASE_KEY
          }
        }
      );

      const salons = await response.json();
      const container = document.getElementById("salons");

      if (!response.ok) {
        container.innerHTML = "<p>Greška pri učitavanju salona.</p>";
        return;
      }

      if (salons.length === 0) {
        container.innerHTML = "<p>Trenutno nema salona.</p>";
        return;
      }

      container.innerHTML = salons.map(salon =>
        `<div>
          <h3>${salon.name || "Salon"}</h3>
        </div>`
      ).join("");
    }

    loadSalons();
  </script>
</body>
</html>
